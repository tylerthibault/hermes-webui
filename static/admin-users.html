<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes access management</title>
<style>
:root{color-scheme:dark}body{font:15px system-ui,-apple-system,sans-serif;background:#101318;color:#eef1f5;max-width:1100px;margin:0 auto;padding:28px}main{background:#191e27;border:1px solid #303846;border-radius:16px;padding:24px}header{display:flex;align-items:center;gap:16px;border-bottom:1px solid #303846;padding-bottom:18px;margin-bottom:22px}header div{flex:1}h1{margin:0 0 4px;font-size:25px}.muted{color:#aab4c2}.grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:24px}.card{border:1px solid #374151;border-radius:12px;padding:16px}label{display:block;font-size:12px;color:#aab4c2;margin:12px 0 5px}input,select,button{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid #485468;background:#11151c;color:inherit}input,select{width:100%;box-sizing:border-box}button{cursor:pointer;background:#276749;border-color:#31805b}button.secondary{background:#273244;border-color:#485468}button.danger{background:#7f1d1d;border-color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.user{border:1px solid #374151;border-radius:10px;padding:14px;margin:10px 0}.user-top{display:flex;gap:10px;align-items:center}.user-top strong{flex:1}.badge{font-size:11px;border-radius:99px;padding:3px 8px;background:#26364d;color:#b9d7ff}.badge.off{background:#49262b;color:#ffc0c7}.user-meta{font-size:12px;color:#aab4c2;margin-top:6px}.user-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.message{min-height:20px;margin:12px 0;color:#fca5a5}.success{color:#86efac}@media(max-width:750px){body{padding:12px}.grid{grid-template-columns:1fr}}
</style></head>
<body><main><header><div><h1>Access management</h1><div class="muted">Create and manage private Hermes bot accounts.</div></div><button class="secondary" id="dashboard">Back to dashboard</button><button class="secondary" id="logout">Log out</button></header>
<p id="message" class="message" role="alert"></p><div class="grid"><section class="card"><h2>Create user</h2><form id="create"><label for="username">Username</label><input id="username" required autocomplete="off" pattern="[^\\s]+"><label for="display">Display name</label><input id="display" required><label for="email">Email (optional)</label><input id="email" type="email"><label for="password">Temporary password</label><input id="password" type="password" required minlength="12" autocomplete="new-password"><label for="role">Role</label><select id="role"><option value="member">Member</option><option value="admin">Administrator</option></select><div class="actions"><button>Create account</button></div></form></section><section><h2>Users</h2><div id="users"><p class="muted">Loading…</p></div></section></div></main>
<script>
const $=id=>document.getElementById(id);const csrf=window.__CSRF_TOKEN__||'';const json=async r=>{try{return await r.json()}catch{return {}}};function msg(t,ok=false){$('message').textContent=t||'';$('message').className='message'+(ok?' success':'')}
async function req(url,opts={}){opts.headers={...(opts.headers||{}),'X-Hermes-CSRF-Token':csrf,'Content-Type':'application/json'};const r=await fetch(url,{...opts,credentials:'include'});if(r.status===401||r.status===403){location.href='/login?next=/admin/users';return null}return r}
function render(users){const root=$('users');root.replaceChildren();if(!users.length){root.innerHTML='<p class="muted">No accounts yet.</p>';return}for(const u of users){const el=document.createElement('article');el.className='user';const top=document.createElement('div');top.className='user-top';const name=document.createElement('strong');name.textContent=(u.display_name||u.username||'Unnamed')+'  @'+(u.username||'external');const badge=document.createElement('span');badge.className='badge'+(u.enabled?'':' off');badge.textContent=u.enabled?'Enabled':'Disabled';top.append(name,badge);const meta=document.createElement('div');meta.className='user-meta';meta.textContent=(u.role||'member')+(u.email?' · '+u.email:'')+' · '+(u.auth_type||'local');const actions=document.createElement('div');actions.className='user-actions';const toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=u.enabled?'Disable':'Enable';toggle.onclick=()=>update(u,{enabled:!u.enabled});const role=document.createElement('button');role.className='secondary';role.textContent=u.role==='admin'?'Make member':'Make admin';role.onclick=()=>update(u,{role:u.role==='admin'?'member':'admin'});const reset=document.createElement('button');reset.className='secondary';reset.textContent='Reset password';reset.onclick=async()=>{const p=prompt('Enter a new password (12+ characters):');if(!p)return;if(p.length<12){msg('Password must be at least 12 characters.');return}const r=await req('/api/admin/users/'+encodeURIComponent(u.id)+'/password',{method:'POST',body:JSON.stringify({password:p})});if(r&&r.ok){msg('Password reset. Existing sessions were revoked.',true);load()}else if(r)msg((await json(r)).error||'Could not reset password.')};actions.append(toggle,role);if(u.username)actions.append(reset);el.append(top,meta,actions);root.append(el)}}
async function update(u,change){const r=await req('/api/admin/users/'+encodeURIComponent(u.id),{method:'PATCH',body:JSON.stringify(change)});if(r&&r.ok){msg('Account updated.',true);load()}else if(r)msg((await json(r)).error||'Could not update account.')}
async function load(){const r=await req('/api/admin/users');if(!r)return;if(!r.ok){msg((await json(r)).error||'Could not load accounts.');return}render((await r.json()).users||[])}
$('create').onsubmit=async e=>{e.preventDefault();const body={username:$('username').value.trim(),display_name:$('display').value.trim(),email:$('email').value.trim(),password:$('password').value,role:$('role').value,profiles:['default']};const r=await req('/api/admin/users',{method:'POST',body:JSON.stringify(body)});if(r&&r.ok){e.target.reset();msg('Account created.',true);load()}else if(r)msg((await json(r)).error||'Could not create account.')};$('dashboard').onclick=()=>location.href='/';$('logout').onclick=async()=>{await req('/api/auth/logout',{method:'POST',body:'{}'});location.href='/login'};load();
</script></body></html>
