<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Studio · Hermes</title><style>body{margin:0;background:#101318;color:#eef1f5;font:15px system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:24px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:18px}.panel{background:#191e27;border:1px solid #303846;border-radius:14px;padding:18px}button,input,textarea{font:inherit;color:inherit;background:#11151c;border:1px solid #485468;border-radius:9px;padding:10px}button{background:#2459a6;cursor:pointer}input,textarea{width:100%;box-sizing:border-box}textarea{min-height:480px;resize:vertical;font-family:ui-monospace,monospace;line-height:1.45}.bot{display:block;width:100%;text-align:left;margin:8px 0;background:transparent;border-color:#3d4758}.bot.active{background:#243957}.muted{color:#aab4c2}.error{color:#ffb4b4;min-height:22px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="app"><div class="top"><div><a href="/account" class="muted">← My account</a><h1>Bot Studio</h1><p class="muted">Create a private bot and write its SOUL.md.</p></div><button id="create">＋ Create bot</button></div><div class="grid"><aside class="panel"><h2>Your bots</h2><div id="bots" class="muted">Loading…</div></aside><section class="panel"><div id="empty"><h2>Select a bot</h2><p class="muted">Create or select a bot to edit its identity.</p></div><form id="editor" hidden><div class="row"><div><label>Bot name<input id="name" maxlength="64" required></label></div><button type="button" id="rename">Rename</button></div><p id="status" class="muted"></p><label>SOUL.md<textarea id="soul" maxlength="131072" spellcheck="true"></textarea></label><p id="message" class="error"></p><button>Save SOUL.md</button></form></section></div></main><script>const $=id=>document.getElementById(id);let bots=[],current=null;async function api(url,opt={}){opt.credentials='include';opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Hermes-CSRF-Token':window.__CSRF_TOKEN__};const r=await fetch(url,opt);if(r.status===401||r.status===403){location.href='/login?next=/bot-studio';return null}return r}async function load(){const r=await api('/api/user/bots');if(!r)return;bots=(await r.json()).bots||[];render();if(current)select(current.id)}function render(){$('bots').replaceChildren(...(bots.length?bots.map(b=>{const x=document.createElement('button');x.className='bot'+(current&&current.id===b.id?' active':'');x.textContent=b.name;x.onclick=()=>select(b.id);return x}):[Object.assign(document.createElement('p'),{textContent:'No bots yet.'})]))}async function select(id){current=bots.find(b=>b.id===id);if(!current)return;render();$('empty').hidden=true;$('editor').hidden=false;$('name').value=current.name;$('status').textContent='Status: '+current.status;$('message').textContent='';const r=await api('/api/user/bots/'+encodeURIComponent(id)+'/soul');if(r)$('soul').value=(await r.json()).content||''}$('create').onclick=async()=>{const name=prompt('Name for the new bot:');if(!name)return;const r=await api('/api/user/bots',{method:'POST',body:JSON.stringify({name})});if(!r){return}if(!r.ok){$('message').textContent=(await r.json()).error||'Could not create bot';return}const d=await r.json();await load();select(d.bot.id)};$('editor').onsubmit=async e=>{e.preventDefault();const r=await api('/api/user/bots/'+encodeURIComponent(current.id)+'/soul',{method:'POST',body:JSON.stringify({content:$('soul').value})});$('message').textContent=r&&r.ok?'Saved.':((r&&await r.json()).error||'Could not save SOUL.md')};$('rename').onclick=async()=>{const name=prompt('New bot name:',current.name);if(!name)return;const r=await api('/api/user/bots/'+encodeURIComponent(current.id)+'/rename',{method:'POST',body:JSON.stringify({name})});if(r&&r.ok){current.name=name;await load()}else if(r)$('message').textContent=(await r.json()).error||'Could not rename bot'};load();</script></body></html>
