<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes Rooms</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#191e27;--panel2:#121720;--line:#303846;--text:#eef1f5;--muted:#9da8b7;--accent:#3b82f6;--danger:#fca5a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;height:100vh}button,input,textarea,select{font:inherit;border:1px solid #485468;border-radius:9px;background:#11151c;color:inherit;padding:10px}button{cursor:pointer;background:#2459a6;border-color:#3678d8}button.secondary{background:transparent}button.danger{color:var(--danger);background:#3a171b}.app{height:100%;display:grid;grid-template-columns:280px 1fr 270px}.sidebar,.details{background:var(--panel);padding:18px;overflow:auto}.sidebar{border-right:1px solid var(--line)}.details{border-left:1px solid var(--line)}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.error{color:#fca5a5;min-height:22px}.room-list{display:grid;gap:8px;margin-top:18px}.room{width:100%;text-align:left;background:transparent;border-color:transparent}.room.active{background:#243957;border-color:#3c6596}.room small{display:block;color:var(--muted);margin-top:4px}.main{display:flex;flex-direction:column;min-width:0}.chat-head{padding:18px;border-bottom:1px solid var(--line)}.messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}.message{max-width:760px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px}.message.mine{align-self:flex-end;background:#1d3e6b}.message .meta{font-size:12px;color:var(--muted);margin-bottom:5px}.composer{padding:16px;border-top:1px solid var(--line);display:flex;gap:10px}.composer textarea{flex:1;resize:none;min-height:48px}.participant{padding:10px 0;border-bottom:1px solid var(--line)}.pill{font-size:11px;color:#9dd6ff;border:1px solid #315a78;border-radius:99px;padding:3px 7px;float:right}.stack{display:grid;gap:10px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.modal>form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(440px,100%)}.hidden{display:none}@media(max-width:900px){.app{grid-template-columns:220px 1fr}.details{display:none}}@media(max-width:620px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.mobile{display:block;position:fixed;inset:0 25% 0 0;z-index:2}.main{min-height:100vh}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><header><div><h1>Rooms</h1><p class="muted">Your conversations</p></div><button class="secondary" id="logout">↪</button></header><button id="newRoom" style="width:100%;margin-top:10px">＋ New room</button><div id="roomList" class="room-list"><p class="muted">Loading…</p></div></aside><main class="main"><header class="chat-head"><button class="secondary" id="menu">☰</button><div style="flex:1"><h2 id="roomTitle">Choose a room</h2><p class="muted" id="roomSubtitle">Create a direct message or shared room.</p></div><button class="secondary" id="refresh">↻</button></header><section id="messages" class="messages"><p class="muted">No room selected.</p></section><form id="composer" class="composer"><textarea id="body" placeholder="Write a message…" disabled maxlength="20000"></textarea><button id="send" disabled>Send</button></form></main><aside class="details"><h3>Participants</h3><div id="participants" class="stack"><p class="muted">Select a room.</p></div><hr><div id="botControls"><h3>My bots</h3><select id="botChoice"><option value="">Choose a bot…</option></select><label class="muted">Participation <input id="botLevel" type="range" min="0" max="100" value="70"></label><button id="addBot" style="width:100%">Add bot to room</button></div><hr><div id="orchestrator"></div></aside></div>
<div id="modal" class="modal hidden"><form id="roomForm"><h2>New room</h2><label>Type<select id="kind"><option value="direct">Direct message</option><option value="room">Shared room</option></select></label><label style="display:block;margin-top:12px">Name<input id="name" maxlength="128" placeholder="Family planning"></label><label style="display:block;margin-top:12px">Invite members<select id="member" multiple size="4"></select></label><label id="orchChoice" style="display:block;margin-top:12px"><input type="checkbox" id="orch"> Include Room Orchestrator</label><p class="muted" id="orchHelp">Direct messages do not include the orchestrator by default.</p><p id="message" class="error"></p><div style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="secondary" id="cancel">Cancel</button><button>Create room</button></div></form></div>
<script>window.__CSRF_TOKEN__;</script><script>
const csrf=()=>window.__CSRF_TOKEN__||'';let rooms=[],current=null;const $=id=>document.getElementById(id);const json=async r=>{try{return await r.json()}catch{return {error:'Unexpected response'}}};
async function api(url,opts={}){opts.credentials='include';opts.headers={...(opts.headers||{}),'Content-Type':'application/json'};if(opts.method&&opts.method!=='GET')opts.headers['X-Hermes-CSRF-Token']=csrf();const r=await fetch(url,opts);if(r.status===401){location.href='/login';return null}return r}
function showError(t){$('message').textContent=t||''}function esc(t){return String(t||'')}
async function loadBots(){const r=await api('/api/user/bots');if(!r||!r.ok)return;const bots=(await r.json()).bots||[];$('botChoice').replaceChildren(new Option('Choose a bot…',''),...bots.map(b=>new Option(b.name+' · '+b.status,b.id)))}
async function loadRooms(){const r=await api('/api/member/rooms');if(!r||!r.ok){showError((await json(r)).error||'Could not load rooms');return}rooms=(await r.json()).rooms||[];const list=$('roomList');list.replaceChildren(...rooms.map(room=>{const b=document.createElement('button');b.className='room'+(current&&current.id===room.id?' active':'');b.innerHTML='<strong></strong><small></small>';b.querySelector('strong').textContent=room.name|| (room.kind==='direct'?'Direct message':'Shared room');b.querySelector('small').textContent=room.kind==='direct'?'Direct · orchestrator off':(room.orchestrator_enabled?'Shared · orchestrator on':'Shared · orchestrator off');b.onclick=()=>openRoom(room.id);return b}));if(!rooms.length)list.innerHTML='<p class="muted">No rooms yet.</p>'}
async function openRoom(id){const r=await api('/api/member/rooms/'+encodeURIComponent(id));if(!r||!r.ok){showError((await json(r)).error||'Could not open room');return}current=(await r.json()).room;render();loadRooms()}
function render(){if(!current)return;$('roomTitle').textContent=current.name|| (current.kind==='direct'?'Direct message':'Shared room');$('roomSubtitle').textContent=current.kind==='direct'?'Private direct conversation':(current.orchestrator_enabled?'Shared room · orchestrator enabled':'Shared room · orchestrator disabled');$('body').disabled=false;$('send').disabled=false;const messages=$('messages');messages.replaceChildren(...(current.messages||[]).map(m=>{const el=document.createElement('article');el.className='message'+(m.sender_id===current.created_by?' mine':'');const meta=document.createElement('div');meta.className='meta';meta.textContent=(m.sender_type==='orchestrator'?'Room Orchestrator':m.sender_type==='bot'?'Bot':'Member')+' · '+new Date(m.created_at).toLocaleString();const text=document.createElement('div');text.textContent=m.body;el.append(meta,text);return el}));messages.scrollTop=messages.scrollHeight;const p=$('participants');p.replaceChildren(...(current.participants||[]).map(x=>{const el=document.createElement('div');el.className='participant';el.textContent=x.participant_type==='user'?'Member · '+x.participant_id:(x.participant_type==='orchestrator'?'Room Orchestrator':'Bot · '+x.participant_id);const tag=document.createElement('span');tag.className='pill';tag.textContent=x.role;el.append(tag);return el}));$('orchestrator').innerHTML='';if(current.kind==='room'){const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.checked=!!current.orchestrator_enabled;box.onchange=toggleOrchestrator;label.append(box,document.createTextNode(' Room Orchestrator'));$('orchestrator').append(label);const note=document.createElement('p');note.className='muted';note.textContent='The orchestrator is optional and receives no messages when off.';$('orchestrator').append(note)}}
async function toggleOrchestrator(e){const r=await api('/api/member/rooms/'+current.id+'/orchestrator',{method:'PATCH',body:JSON.stringify({enabled:e.target.checked})});if(!r||!r.ok){e.target.checked=!e.target.checked;showError((await json(r)).error||'Could not update orchestrator');return}current=(await r.json()).room;render();loadRooms()}
async function addBot(){if(!current||!$('botChoice').value)return;const r=await api('/api/member/rooms/'+current.id+'/bots',{method:'POST',body:JSON.stringify({bot_id:$('botChoice').value,participation_level:Number($('botLevel').value)})});if(!r||!r.ok){showError((await json(r)).error||'Could not add bot');return}openRoom(current.id)}
$('addBot').onclick=addBot;
$('composer').onsubmit=async e=>{e.preventDefault();const value=$('body').value.trim();if(!current||!value)return;const r=await api('/api/member/rooms/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:value})});if(!r||!r.ok){showError((await json(r)).error||'Could not send');return}$('body').value='';openRoom(current.id)};
$('refresh').onclick=()=>current&&openRoom(current.id);$('menu').onclick=()=>$('sidebar').classList.toggle('mobile');$('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST',body:'{}'});location.href='/login'};$('cancel').onclick=()=>{$('modal').classList.add('hidden');showError('')};$('kind').onchange=()=>{$('orchChoice').style.display=$('kind').value==='room'?'block':'none';$('orchHelp').textContent=$('kind').value==='room'?'You can change this later as the room owner.':'Direct messages do not include the orchestrator by default.'};$('newRoom').onclick=async()=>{const r=await api('/api/member/members');if(!r||!r.ok)return;const members=(await r.json()).members||[];$('member').replaceChildren(...members.map(m=>new Option(m.display_name||m.username,m.id)));$('modal').classList.remove('hidden')};$('roomForm').onsubmit=async e=>{e.preventDefault();const member_ids=[...$('member').selectedOptions].map(o=>o.value);if(!$('name').value.trim()||!member_ids.length){showError('Choose a name and at least one member.');return}const kind=$('kind').value;if(kind==='direct'&&member_ids.length!==1){showError('A direct message must have exactly one other member.');return}const r=await api('/api/member/rooms',{method:'POST',body:JSON.stringify({kind,name:$('name').value,participant_user_ids:member_ids,orchestrator_enabled:kind==='room'&&$('orch').checked})});if(!r||!r.ok){showError((await json(r)).error||'Could not create room');return}const created=await r.json();$('modal').classList.add('hidden');$('roomForm').reset();await loadRooms();openRoom(created.room.id)};loadBots();loadRooms();
</script></body></html>
