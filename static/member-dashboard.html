<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Hermes Bots</title>
<style>body{font:16px system-ui;background:#101318;color:#eef1f5;max-width:900px;margin:0 auto;padding:32px}main{background:#191e27;border:1px solid #303846;border-radius:16px;padding:24px}button,input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #485468;background:#11151c;color:inherit}button{cursor:pointer;background:#276749;border-color:#31805b}.row{display:flex;gap:10px;margin:18px 0}.bot{border:1px solid #374151;border-radius:10px;padding:14px;margin:10px 0;display:flex;gap:10px;align-items:center}.bot span{flex:1}.danger{background:#7f1d1d;border-color:#991b1b}.muted{color:#aab4c2}.error{color:#fca5a5}</style></head>
<body><main><header class="row"><div><h1>My Hermes bots</h1><p class="muted">Private bots belonging to your account.</p></div><button id="logout">Log out</button></header><form id="create" class="row"><input id="name" required maxlength="64" placeholder="Bot name"><button>Create bot</button></form><p id="message" class="error" role="alert"></p><section id="bots" aria-live="polite"><p class="muted">Loading…</p></section></main>
<script>
const csrf=()=>window.__CSRF_TOKEN__||'';
const json=async r=>{try{return await r.json()}catch{return {error:'Unexpected server response'}}};
function message(text){document.getElementById('message').textContent=text||'';}
async function request(url,options={}){options.headers={...(options.headers||{}),'X-Hermes-CSRF-Token':csrf(),'Content-Type':'application/json'};const r=await fetch(url,options);if(r.status===401){location.href='/login';return null}return r;}
async function load(){const el=document.getElementById('bots');try{const r=await fetch('/api/user/bots');if(!r.ok)throw new Error((await json(r)).error||'Could not load bots');const d=await r.json();el.replaceChildren(...(d.bots||[]).map(b=>{const x=document.createElement('article');x.className='bot';const label=document.createElement('span');label.textContent=b.name+' — '+b.status;x.append(label);const action=document.createElement('button');action.textContent=b.status==='running'?'Stop':'Start';action.onclick=async()=>{action.disabled=true;const res=await request('/api/user/bots/'+encodeURIComponent(b.id)+'/'+(b.status==='running'?'stop':'start'),{method:'POST',body:'{}'});if(res&&!res.ok)message((await json(res)).error||'Could not update bot');load()};const rename=document.createElement('button');rename.textContent='Rename';rename.onclick=async()=>{const name=prompt('New bot name',b.name);if(!name)return;const res=await request('/api/user/bots/'+encodeURIComponent(b.id)+'/rename',{method:'POST',body:JSON.stringify({name})});if(res&&!res.ok)message((await json(res)).error||'Could not rename bot');load()};const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete this bot and its private data?'))return;const res=await request('/api/user/bots/'+encodeURIComponent(b.id),{method:'DELETE',body:'{}'});if(res&&!res.ok)message((await json(res)).error||'Could not delete bot');load()};x.append(action,rename,del);return x;}));if(!d.bots?.length)el.innerHTML='<p class="muted">No bots yet. Create your first private bot above.</p>'}catch(e){el.innerHTML='';message(e.message||'Could not load bots')}}
document.getElementById('create').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('name');const r=await request('/api/user/bots',{method:'POST',body:JSON.stringify({name:input.value})});if(!r||!r.ok){if(r)message((await json(r)).error||'Could not create bot');return}input.value='';message('');load()};
document.getElementById('logout').onclick=async()=>{await request('/api/auth/logout',{method:'POST',body:'{}'});location.href='/login'};load();
</script></body></html>
