<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create administrator</title>
<style>body{margin:0;background:#111;color:#eee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(440px,calc(100% - 32px));padding:28px;background:#1d1d1d;border:1px solid #444;border-radius:14px}h1{margin-top:0}p{color:#bbb;line-height:1.45}label{display:block;margin:15px 0 6px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #555;border-radius:8px;background:#111;color:#fff;font:inherit}button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:8px;background:#e6c400;color:#111;font-weight:700;font:inherit;cursor:pointer}.error{color:#ff9c9c;min-height:1.4em;margin-top:12px}</style></head>
<body><main class="card"><h1>Create your administrator account</h1><p>Your current WebUI login session is valid, but it is not linked to a named account yet. Create the first local administrator now using the username and password you want to use for future logins. This one-time setup closes after the first account is created.</p><form id="form"><label for="username">Username</label><input id="username" autocomplete="username" required pattern="[A-Za-z0-9._-]{3,64}"><label for="display_name">Display name</label><input id="display_name" autocomplete="name" required><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><div class="error" id="error" role="alert"></div><button>Create administrator</button></form></main>
<script>(function(){const form=document.getElementById('form'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){error.textContent='Passwords do not match.';return}try{const r=await fetch('/api/auth/bootstrap',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),display_name:document.getElementById('display_name').value.trim(),password,profiles:[]})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not create administrator');window.location='/login?next=/admin/users'}catch(err){error.textContent=err.message}})})()</script></body></html>
